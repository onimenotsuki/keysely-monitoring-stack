name: AWS CDK

on:
  pull_request:
    branches:
      - main
      - develop
      - feat/*
  push:
    branches:
      - main
      - develop
      - feat/*

permissions:
  id-token: write
  contents: read

jobs:
  diff:
    name: CDK diff (dev)
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stack/package-lock.json
      - run: npm install
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: keysely-monitoring-stack-diff-dev-${{ github.ref_name }}
      - run: npx cdk diff KeyselyMonitoringStack-dev --fail false

  deploy-dev:
    name: CDK deploy (dev)
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stack/package-lock.json
      - run: npm install
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: keysely-monitoring-stack-deploy-dev-${{ github.ref_name }}
      - run: npx cdk deploy KeyselyMonitoringStack-dev --require-approval never

  deploy-prod:
    name: CDK deploy (prod)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stack/package-lock.json
      - run: npm install
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: keysely-monitoring-stack-prod-${{ github.ref_name }}
      - run: npx cdk deploy KeyselyMonitoringStack-prod --require-approval never
